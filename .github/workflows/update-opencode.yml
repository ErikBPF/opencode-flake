name: Update opencode Version

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch: {}
  workflow_run:
    workflows: [check]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output="$(./scripts/update-opencode.sh --check 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          current="$(printf '%s\n' "$output" | sed -n 's/.*current: //p' | tail -1)"
          latest="$(printf '%s\n' "$output" | sed -n 's/.*latest:  //p' | tail -1)"
          release="$(printf '%s\n' "$output" | sed -n 's/.*release: //p' | tail -1)"
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "update_needed=false"
          elif [ "$status" -eq 1 ]; then
            echo "update_needed=true"
          else
            exit "$status"
          fi >> "$GITHUB_OUTPUT"

      - name: Apply update
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix shell nixpkgs#nix-update --command \
            ./scripts/update-opencode.sh --version "${{ steps.check.outputs.latest }}"

      - name: Create pull request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump opencode to ${{ steps.check.outputs.latest }}"
          title: "chore: bump opencode ${{ steps.check.outputs.current }} -> ${{ steps.check.outputs.latest }}"
          body: |
            ## Automated opencode bump

            Updates the packaged opencode release from `${{ steps.check.outputs.current }}` to `${{ steps.check.outputs.latest }}`.

            Upstream release: ${{ steps.check.outputs.release }}

            ### Verified in updater
            - `nix-update opencode --subpackage node_modules`
            - `nix build .#opencode`
            - `nix run .#opencode -- --version`

            Required PR checks must pass before auto-merge.
          branch: update-opencode-${{ steps.check.outputs.latest }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable auto-merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" --auto --squash --delete-branch

      - name: Summary
        if: always()
        run: |
          {
            echo "## opencode update summary"
            echo
            echo "- Current: \`${{ steps.check.outputs.current }}\`"
            echo "- Latest: \`${{ steps.check.outputs.latest }}\`"
            echo "- Release: ${{ steps.check.outputs.release }}"
            echo "- Update needed: \`${{ steps.check.outputs.update_needed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN-created PR checks require maintainer approval. React after
  # that trusted check run passes instead of holding the scheduled job open.
  post-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'update-opencode-')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch post-merge checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPDATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr_number="$(gh pr list --head "$UPDATE_BRANCH" --state all --limit 1 --json number --jq '.[0].number // empty')"
          test -n "$pr_number"
          for _ in $(seq 1 30); do
            state="$(gh pr view "$pr_number" --json state --jq .state)"
            case "$state" in
              MERGED)
                gh workflow run check.yml --ref main
                gh workflow run auto-tag-opencode-bump.yml --ref main
                exit 0
                ;;
              CLOSED)
                echo "Update PR closed without merge" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for checked update PR to merge" >&2
          exit 1
